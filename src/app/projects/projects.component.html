<section id="projects" class="py-5">
  <div class="container px-4">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold mb-3">
        My <span class="text-lilac">Projects</span>
      </h2>
      <p class="lead text-muted mx-auto" style="max-width: 40rem">
        A selection of personal and team projects I've built.
      </p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">
      <div class="col" *ngFor="let project of projects">
        <div class="project-card h-100">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <h3 class="h5 fw-bold mb-1">{{ project.name }}</h3>
              <div class="text-lilac fw-semibold small">{{ project.tagline }}</div>
              <div class="publication-note small" *ngIf="project.publication">
                <i class="bi bi-trophy-fill me-1"></i>{{ project.publication }}
              </div>
            </div>
            <div class="d-flex flex-nowrap ms-3">
              <a
                *ngFor="let link of project.links"
                [href]="link.url"
                target="_blank"
                rel="noopener"
                class="btn btn-outline-secondary btn-sm rounded-circle p-0 ms-2"
                style="width: 32px; height: 32px; line-height: 32px"
                [title]="link.label"
              >
                <i class="bi" [ngClass]="link.icon"></i>
              </a>
            </div>
          </div>

          <p class="text-muted small mb-3">{{ project.description }}</p>

          <div class="d-flex flex-wrap gap-2 mt-auto">
            <span *ngFor="let tech of project.tech" class="badge project-tech">
              {{ tech }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
