<section id="recognition" class="py-5">
  <div class="container px-4">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold mb-3">
        Recognition <span class="text-lilac">& Awards</span>
      </h2>
      <p class="lead text-muted mx-auto" style="max-width: 40rem">
        Awards, honors, and grants from the research community.
      </p>
    </div>

        <div class="award-year" *ngFor="let group of byYear">
          <div class="award-year-label">{{ group.year }}</div>
          <ul class="award-list">
            <li class="award-item" *ngFor="let rec of group.items">
              <i class="bi bi-trophy-fill award-icon"></i>
              <div>
                <h3 class="h5 fw-bold mb-1">{{ rec.title }}</h3>
                <div class="text-lilac small fw-semibold">{{ rec.event }}</div>
                <div class="text-muted small" *ngIf="rec.relatedWork">
                  {{ rec.relatedWork }}
                </div>
              </div>
            </li>
          </ul>
        </div>
  </div>
</section>
