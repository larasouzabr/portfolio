<section id="recognition" class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold mb-3">
        Recognition <span class="text-lilac">& Awards</span>
      </h2>
      <p class="text-muted">Awards, honors, and grants from the research community</p>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
      <div class="col" *ngFor="let rec of recognitions">
        <div class="recognition-card h-100">
          <i class="bi bi-trophy-fill recognition-icon"></i>
          <h3 class="h6 fw-bold mb-1">{{ rec.title }}</h3>
          <div class="text-lilac small fw-semibold mb-2">{{ rec.event }}</div>
          <p class="text-muted small mb-2">{{ rec.relatedWork }}</p>
          <div class="text-muted small mt-auto">
            <i class="bi bi-calendar3 me-1"></i>{{ rec.year }}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
