<section id="experience" class="py-5">
  <div class="container px-4">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold mb-3">
        Work <span class="text-lilac">Experience</span>
      </h2>
      <p class="lead text-muted mx-auto" style="max-width: 40rem">
        My professional journey in tech and education.
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12">
        <ol class="timeline">
          <li class="timeline-item" *ngFor="let exp of experiences">
            <div class="timeline-marker"></div>
            <div class="timeline-content">
              <div
                class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3"
              >
                <div>
                  <h3 class="h5 fw-bold mb-1">{{ exp.position }}</h3>
                  <div class="fw-semibold small text-lilac">
                    <i class="bi bi-building me-2"></i>{{ exp.company }}
                  </div>
                </div>
                <div class="text-sm-end mt-3 mt-sm-0">
                  <div class="text-muted small">
                    <i class="bi bi-calendar3 me-1"></i>{{ exp.period }}
                  </div>
                </div>
              </div>

              <p class="text-muted small mb-3">{{ exp.description }}</p>

              <div class="d-flex flex-wrap gap-2">
                <span
                  *ngFor="let tech of exp.technologies"
                  class="chip"
                >
                  {{ tech }}
                </span>
              </div>
            </div>
          </li>
        </ol>
      </div>
    </div>
  </div>
</section>
