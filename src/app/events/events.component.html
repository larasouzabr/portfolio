<section id="events" class="py-5">
  <div class="container px-4">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold mb-3">
        Outreach & <span class="text-lilac">Talks</span>
      </h2>
      <p class="lead text-muted mx-auto" style="max-width: 40rem">
        Lectures, workshops, and conference presentations.
      </p>
    </div>

    <div class="row row-cols-1 row-cols-lg-2 g-4">
      <div class="col" *ngFor="let event of events">
        <article class="event-card h-100">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge" [ngClass]="'tag-' + event.tag.toLowerCase()">
              {{ event.tag }}
            </span>
            <span class="text-muted small">
              <i class="bi bi-calendar3 me-1"></i>{{ event.year }}
              <ng-container *ngIf="event.location">
                &middot; <i class="bi bi-geo-alt me-1"></i>{{ event.location }}
              </ng-container>
            </span>
          </div>

          <h3 class="event-title h5 fw-bold mb-2">{{ event.title }}</h3>
          <p class="text-muted mb-3" [innerHTML]="event.description"></p>

          <div class="event-media" *ngIf="event.images as images">
            <div class="event-gallery" [class.single]="images.length === 1">
              <img
                *ngFor="let image of images"
                [src]="image.src"
                [alt]="image.alt"
              />
            </div>
          </div>

          <div class="event-media" *ngIf="event.video as video">
            <video controls [poster]="video.poster">
              <source [src]="video.src" type="video/mp4" />
              Formato não suportado
            </video>
          </div>

          <figcaption *ngIf="event.caption" class="event-caption">
            {{ event.caption }}
          </figcaption>
        </article>
      </div>
    </div>
  </div>
</section>
